function financialChart(c,key,fill){const fs=c.financial,vs=fs.map(x=>x[key]),W=520,H=168,L=57,R=20,T=30,B=31,min=Math.min(0,...vs),max=Math.max(0,...vs),pad=(max-min)*.17||1,lo=min<0?min-pad:0,hi=max+pad,y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),x=i=>L+(W-L-R)*(i+.5)/fs.length,bw=52;let s='';niceTicks(lo,hi,3).forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#22324d"/><text x="${L-8}" y="${y(v)+4}" fill="#8494ac" font-size="11" text-anchor="end">${num(v,0)}</text>`);s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#52657c"/>`;vs.forEach((v,i)=>{s+=`<rect x="${x(i)-bw/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(v)))}" fill="${v<0?'#917261':fill}" rx="3"><title>${fs[i].date}: ${num(v,3)} ${c.financialUnit}</title></rect><text x="${x(i)}" y="${v<0?y(v)+14:y(v)-8}" fill="#e9eef6" font-size="12" text-anchor="middle">${num(v)}</text><text x="${x(i)}" y="${H-8}" fill="#8494ac" font-size="11" text-anchor="middle">FY${fs[i].period}</text>`});const g=growth(c,key);s+=`<text x="${W-R}" y="15" text-anchor="end" fill="#e0a23a" font-size="12">최근 FY ${g===null?'적자 기저':pct(g)}</text>`;return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.name} 최근 3개년 ${key==='rev'?'매출':c.metricLabel}, ${c.financialUnit}">${s}</svg>`}
function card(c,i){const f=c.financial.at(-1);return `<section class="company" id="co-${c.id}"><div class="wrap"><div class="card"><a class="back" href="#map">Top<br>지도</a><div class="head"><div><p class="muted" style="margin:0 0 3px">${i+1} / 23 · ${esc(c.en)}</p><h2>${star(c)}${c.name}<span class="code">${c.id}</span></h2><div class="chips"><span class="chip">${c.flag} ${c.country} · ${c.sector}</span><span class="chip ${c.reference?'event':'verified'}">${c.reference?'참고 기업':'원본 신고가 '+c.date}</span><span class="chip event">${c.type}</span></div></div><div class="kpis"><div class="kpi"><div class="k">원화 시총 · 원본 제공</div><div class="v">${num(c.cap)}조원</div></div><div class="kpi"><div class="k">11/20 종가</div><div class="v">${num(c.price,2)} <span class="code">${c.unit}</span></div></div></div></div>
<dl class="tx"><dt>사업</dt><dd>${esc(c.biz)}</dd><dt>최신 실적</dt><dd>${esc(c.earnings)}</dd><dt>가이던스</dt><dd>${esc(c.guidance)}</dd><dt>상승 성격</dt><dd class="reason">${esc(c.interpretation)}</dd></dl>
<div class="chart-grid"><div><div class="ctitle"><span>주가 · 실제 주간 종가 (${c.unit})</span><div class="chart-controls" role="group" aria-label="${c.name} 차트 기간"><button data-period="1" data-id="${c.id}" aria-pressed="false">1년</button><button data-period="2" data-id="${c.id}" class="on" aria-pressed="true">2년</button></div></div><div class="chartbox price" data-price="${c.id}"></div><div class="chartmetrics">${priceMetrics(c)}</div><p class="chart-sub">${c.series[0].d}~2026-11-20 · 주간 종가 · 52주 장중 고가·저가선<br>52주 고가선은 11/20 기준 시세 공급자 값. 원본에 표시된 과거 신고가 날짜와 구분.</p><div class="verdict"><b>국내 연결</b> ${esc(c.kr)}</div><div class="q3line"><b>확인할 지표</b> ${esc(c.check)}<br><b>유의점</b> ${esc(c.caveat)}</div></div><div class="stack"><div><div class="ctitle"><span>최근 3개년 매출 (${c.financialUnit})</span><span class="legend"><i style="background:#3987e5"></i>연간 확정</span></div><div class="chartbox">${financialChart(c,'rev','#3987e5')}</div></div><div><div class="ctitle"><span>최근 3개년 ${c.metricLabel} (${c.financialUnit})</span><span class="legend"><i style="background:#4aa3a0"></i>연간 확정</span></div><div class="chartbox">${financialChart(c,c.metric,'#4aa3a0')}${c.metric==='op'?`<div class="opm"><span>연간 OPM</span>${c.financial.map(f=>`<span>${f.period} <strong>${num(f.op/f.rev*100,1)}%</strong></span>`).join('')}</div>`:`<p class="chart-sub">보험사는 공급자 표준화 매출·순이익을 표시. 보험료·보험수익·투자손익·기초이익과 혼용하지 않습니다.</p>`}</div></div><p class="chart-sub">FY는 공급자의 회계연도 종료 연월. 분기 수치가 아닌 연간 실적입니다. 최신 2026년 분기·누계 업데이트는 위 ‘최신 실적’에 별도 표시했습니다.</p></div></div>

function indexSections(){return `<section id="sector-indices"><div class="wrap wide"><p class="eyebrow">COUNTRY SECTOR INDICES</p><div class="head"><h2>국가별 섹터 지수</h2><a class="btn" href="#map">기업 섹터 지도</a></div><p class="sub">독일 10 · 영국 9 · 프랑스 9 · ETF가 아닌 업종 지수 · 기준일 2026.11.20 (CXPS 11.19)</p><div class="toolbar" role="group" aria-label="섹터 지수 국가 필터">${['전체',...INDEX_COUNTRIES].map((x,i)=>`<button data-index-country="${x}" class="${i===0?'on':''}" aria-pressed="${i===0}">${x}</button>`).join('')}<span class="index-chart-jumps">${INDEX_COUNTRIES.map((x,i)=>`<a href="#index-country-${i}">${x} 차트</a>`).join(' · ')}</span></div><div class="tablebox index-overview"><table class="data-table"><thead><tr><th class="l">국가</th><th class="l">섹터 · 지수</th><th>종가</th><th>고가 대비</th><th>1M</th><th>3M</th><th>1Y</th><th>기준일</th></tr></thead><tbody id="index-rows"></tbody></table></div><p class="index-def">종가 단위는 포인트(pt). 고가 대비는 <b>52주 최고 종가</b> 대비 낙폭입니다. 1M·3M·1Y는 1·3·12개월 전 같은 날짜(휴장일은 직전 거래일) 종가 대비이며, 원화로 환산하지 않았습니다.</p><p class="index-def">독일은 배당 포함 성과지수, 영국·프랑스는 가격지수입니다. 영국 에너지는 공급자의 <b>FTSE 350 Oil & Gas (FTUB6010)</b>로 대응했으며, 광범위한 Energy 지수와 구분합니다. CXPS는 공식 이력이 확인된 <b>11/19</b> 기준입니다.</p></div></section>${INDEX_COUNTRIES.map((country,i)=>`<section id="index-country-${i}" class="long"><div class="wrap wide"><div class="head"><div><p class="eyebrow">${['DAXSECTOR','FTSE 350 SECTORS','CAC SECTORS'][i]}</p><h2>${country} · 섹터별 차트</h2></div><a class="btn" href="#sector-indices">섹터 표</a></div><p class="sub">${i===0?'배당 포함 성과지수 · Prime Standard 섹터 분류 · CXPS는 11/19 기준':i===1?'FTSE 350 업종별 가격지수 · 보험·부동산·유틸리티는 광역 업종 지수 사용':'Euronext Paris 업종별 가격지수 · 공식 CAC 명칭과 티커 사용'} · 고점선은 52주 최고 종가</p><div class="sector-chart-grid">${D.sectorIndices.filter(c=>c.country===country).map(indexCard).join('')}</div></div></section>`).join('')}`}

let selectedCountry='전체',onlyFavorites=false,refOnly=false;function renderRows(){const q=$('#search').value.trim().toLowerCase(),cs=D.companies.filter(c=>(selectedCountry==='전체'||c.country===selectedCountry)&&(!onlyFavorites||favorites.has(c.id))&&(!refOnly||c.reference)&&(!q||[c.name,c.en,c.id,c.sector,c.type,c.why].join(' ').toLowerCase().includes(q)));$('#rows').innerHTML=cs.map(c=>`<tr data-open="${c.id}"><td class="l">${star(c)}</td><td class="l"><a href="#co-${c.id}">${c.flag} ${c.name}<span class="secondary">${c.id} · ${c.reference?'참고 기업':c.type}</span></a></td><td class="l">${c.sector}</td><td>${num(c.cap)}</td><td class="l">${esc(c.date)}</td><td>${num(c.price,2)}<span class="secondary">${c.unit}</span></td><td class="${color(c.gap)}">${pct(c.gap)}</td>${[4,13,52].map(n=>`<td class="${color(c['return'+n])}">${pct(c['return'+n])}</td>`).join('')}</tr>`).join('');$('#count').textContent=`표시 ${cs.length} / 23개 · 참고 IHG 1개 포함 · 즐겨찾기 ${favorites.size}개`;$('#none').hidden=cs.length>0}

function niceTicks(lo,hi,n){const span=hi-lo||1,step0=span/n,mag=10**Math.floor(Math.log10(step0)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||10*mag;let a=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)a.push(v);return a}
function drawPrice(c,years=2){const box=document.querySelector(`[data-price="${c.id}"]`),s=years===1?c.series.slice(-53):c.series,W=560,H=326,L=52,R=90,T=30,B=35,n=s.length,alllo=Math.min(...s.map(p=>p.c),c.low),allhi=Math.max(c.high,...s.map(p=>p.c)),pad=(allhi-alllo)*.12||1,lo=alllo-pad,hi=allhi+pad,x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));let g='';niceTicks(lo,hi,5).forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#22324d"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="#8494ac" font-size="12">${num(v,0)}</text>`);for(let i=0;i<5;i++){const k=Math.round((n-1)*i/4);g+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle" fill="#8494ac" font-size="12">${s[k].d.slice(2,7).replace('-','.')}</text>`}g+=`<line x1="${L}" x2="${W-R}" y1="${y(c.high)}" y2="${y(c.high)}" stroke="#31975c" stroke-dasharray="5 4"/><text x="${W-R+7}" y="${y(c.high)-6}" fill="#7fe07f" font-size="11">${c.isSectorIndex?'52주 최고 종가':'52주 고가'}</text><text x="${W-R+7}" y="${y(c.high)+8}" fill="#7fe07f" font-size="12">${num(c.high,2)}</text>`;g+=`<line x1="${L}" x2="${W-R}" y1="${y(c.low)}" y2="${y(c.low)}" stroke="#52657c" stroke-dasharray="2 4"/><text x="${W-R+7}" y="${y(c.low)+1}" fill="#8494ac" font-size="11">${c.isSectorIndex?'52주 최저 종가':'52주 저가'}</text><text x="${W-R+7}" y="${y(c.low)+15}" fill="#8494ac" font-size="12">${num(c.low,2)}</text>`;const path=s.map((p,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(p.c).toFixed(2)).join('');g+=`<path d="${path} L${x(n-1)} ${H-B} L${L} ${H-B} Z" fill="url(#fade-${c.id})"/><path d="${path}" fill="none" stroke="#3987e5" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(c.price)}" r="4" fill="#76b1ff"/><g display="${c.isSectorIndex?'none':'inline'}"><text x="${W-R+7}" y="${y(c.price)+31}" fill="#e9eef6" font-size="14" font-weight="650">${num(c.price,2)}</text><text x="${W-R+7}" y="${(y(c.low)+y(c.high))/2}" fill="#fab219" font-size="13" font-weight="650">+${num((c.price/c.low-1)*100,0)}%</text><text x="${W-R+7}" y="${(y(c.low)+y(c.high))/2+16}" fill="#8494ac" font-size="10">저가 대비</text></g>`;
if(c.id==='SPI'){const event='2026-05-15',k=s.findIndex(p=>p.d>=event);if(k>=0){g+=`<line x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${H-B}" stroke="#796125" stroke-dasharray="3 5"/><text x="${Math.max(L+3,x(k)-60)}" y="17" fill="#c9a349" font-size="11">5/14 · 250p 인수제안</text>`}}
box.innerHTML=`<div class="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.name} 실제 ${years}년 주간 종가 차트, 마지막 ${c.price} ${c.unit}, 52주 고가 ${c.high}, 저가 ${c.low}"><defs><linearGradient id="fade-${c.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3987e5" stop-opacity=".12"/><stop offset="100%" stop-color="#3987e5" stop-opacity="0"/></linearGradient></defs>${g}<line class="cross" visibility="hidden" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#8494ac" stroke-dasharray="3 3"/><circle class="dot" visibility="hidden" r="4" fill="#e9eef6"/><rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
const hit=box.querySelector('.hit'),cross=box.querySelector('.cross'),dot=box.querySelector('.dot'),tip=box.querySelector('.tip');hit.addEventListener('pointermove',e=>{const r=box.querySelector('svg').getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(s[i].c));dot.setAttribute('visibility','visible');tip.textContent=s[i].d+' 주 종가 · '+num(s[i].c,2)+' '+c.unit;tip.style.display='block'});hit.addEventListener('pointerleave',()=>{tip.style.display='none';cross.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden')})}
renderRows();renderIndexRows();[...D.companies,...D.sectorIndices].forEach(c=>drawPrice(c));$('#search').addEventListener('input',renderRows);
function toggleButton(id,v){$(id).classList.toggle('on',v);$(id).setAttribute('aria-pressed',v)}$('#favorites').onclick=()=>{onlyFavorites=!onlyFavorites;toggleButton('#favorites',onlyFavorites);renderRows()};$('#refOnly').onclick=()=>{refOnly=!refOnly;toggleButton('#refOnly',refOnly);renderRows()};
document.addEventListener('click',e=>{const ix=e.target.closest('[data-index-country]');if(ix){renderIndexRows(ix.dataset.indexCountry);document.querySelectorAll('[data-index-country]').forEach(b=>{const on=b===ix;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});return}const row=e.target.closest('[data-open]');if(row&&!e.target.closest('[data-fav]')){const id='co-'+row.dataset.open;e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'instant'});history.replaceState(null,'','#'+id);return}const anchor=e.target.closest('a[href^="#"]');if(anchor){const targetId=anchor.getAttribute('href').slice(1),target=document.getElementById(targetId);if(target){e.preventDefault();target.scrollIntoView({behavior:'instant'});history.replaceState(null,'','#'+targetId)}return}const b=e.target.closest('[data-fav]');if(b){const id=b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('europe-list23-favorites-v1',JSON.stringify([...favorites]))}catch{}document.querySelectorAll('[data-fav]').forEach(b=>{const on=favorites.has(b.dataset.fav);b.classList.toggle('on',on);b.textContent=on?'★':'☆';b.setAttribute('aria-pressed',on)});renderRows();return}const f=e.target.closest('[data-country]');if(f){selectedCountry=f.dataset.country;document.querySelectorAll('[data-country]').forEach(b=>{const on=b.dataset.country===selectedCountry;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});renderRows()}const p=e.target.closest('[data-period]');if(p){drawPrice([...D.companies,...D.sectorIndices].find(c=>c.id===p.dataset.id),+p.dataset.period);document.querySelectorAll(`[data-period][data-id="${p.dataset.id}"]`).forEach(b=>{const on=b===p;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}});
function saveFile(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#downloadJSON').onclick=()=>saveFile(JSON.stringify(D,null,2),'europe_list23_20261120.json','application/json');$('#downloadCSV').onclick=()=>{const rows=[['기준일','국가','기업','종목','원본시총_조원','원본신고가일','종가','주가통화','고가대비_pct','참고기업','최신실적','가이던스','출처'],...D.companies.map(c=>[D.asof,c.country,c.name,c.symbol,c.cap,c.date,c.price,c.unit,c.gap.toFixed(3),c.reference?'참고':'',c.earnings,c.guidance,c.officialURL])];saveFile('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'europe_list23_20261120.csv','text/csv;charset=utf-8')};
const deck=$('#deck'),sections=[...document.querySelectorAll('section')];let active=0,queued=false;function position(){active=0;const t=deck.getBoundingClientRect().top;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top-t<=150)active=i});$('#position').textContent=(active+1)+' / '+sections.length;$('#prev').disabled=active===0;$('#next').disabled=active===sections.length-1;queued=false}function go(i){i=Math.max(0,Math.min(sections.length-1,i));sections[i].scrollIntoView({behavior:'instant'});history.replaceState(null,'','#'+sections[i].id)}deck.addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(position)}});$('#prev').onclick=()=>go(active-1);$('#next').onclick=()=>go(active+1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,summary')||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End'].includes(e.key)){e.preventDefault();go(e.key==='Home'?0:e.key==='End'?sections.length-1:active+(['ArrowDown','PageDown'].includes(e.key)?1:-1))}});if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView({behavior:'instant'})}position();
