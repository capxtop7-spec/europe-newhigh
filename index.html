let selectedCountry='전체',onlyFavorites=false,refOnly=false;function renderRows(){const q=$('#search').value.trim().toLowerCase(),cs=D.companies.filter(c=>(selectedCountry==='전체'||c.country===selectedCountry)&&(!onlyFavorites||favorites.has(c.id))&&(!refOnly||c.reference)&&(!q||[c.name,c.en,c.id,c.sector,c.type,c.why].join(' ').toLowerCase().includes(q)));$('#rows').innerHTML=cs.map(c=>`<tr data-open="${c.id}"><td class="l">${star(c)}</td><td class="l"><a href="#co-${c.id}">${c.flag} ${c.name}<span class="secondary">${c.id} · ${c.reference?'참고 기업':c.type}</span></a></td><td class="l">${c.sector}</td><td>${num(c.cap)}</td><td class="l">${esc(c.date)}</td><td>${num(c.price,2)}<span class="secondary">${c.unit}</span></td><td class="${color(c.gap)}">${pct(c.gap)}</td>${[4,13,52].map(n=>`<td class="${color(c['return'+n])}">${pct(c['return'+n])}</td>`).join('')}</tr>`).join('');$('#count').textContent=`표시 ${cs.length} / 23개 · 참고 IHG 1개 포함 · 즐겨찾기 ${favorites.size}개`;$('#none').hidden=cs.length>0}

function niceTicks(lo,hi,n){const span=hi-lo||1,step0=span/n,mag=10**Math.floor(Math.log10(step0)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||10*mag;let a=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)a.push(v);return a}
function drawPrice(c,years=2){const box=document.querySelector(`[data-price="${c.id}"]`),s=years===1?c.series.slice(-53):c.series,W=560,H=326,L=52,R=90,T=30,B=35,n=s.length,alllo=Math.min(...s.map(p=>p.c),c.low),allhi=Math.max(c.high,...s.map(p=>p.c)),pad=(allhi-alllo)*.12||1,lo=alllo-pad,hi=allhi+pad,x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));let g='';niceTicks(lo,hi,5).forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#22324d"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="#8494ac" font-size="12">${num(v,0)}</text>`);for(let i=0;i<5;i++){const k=Math.round((n-1)*i/4);g+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle" fill="#8494ac" font-size="12">${s[k].d.slice(2,7).replace('-','.')}</text>`}g+=`<line x1="${L}" x2="${W-R}" y1="${y(c.high)}" y2="${y(c.high)}" stroke="#31975c" stroke-dasharray="5 4"/><text x="${W-R+7}" y="${y(c.high)-6}" fill="#7fe07f" font-size="11">52주 고가</text><text x="${W-R+7}" y="${y(c.high)+8}" fill="#7fe07f" font-size="12">${num(c.high,2)}</text>`;g+=`<line x1="${L}" x2="${W-R}" y1="${y(c.low)}" y2="${y(c.low)}" stroke="#52657c" stroke-dasharray="2 4"/><text x="${W-R+7}" y="${y(c.low)+1}" fill="#8494ac" font-size="11">52주 저가</text><text x="${W-R+7}" y="${y(c.low)+15}" fill="#8494ac" font-size="12">${num(c.low,2)}</text>`;const path=s.map((p,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(p.c).toFixed(2)).join('');g+=`<path d="${path} L${x(n-1)} ${H-B} L${L} ${H-B} Z" fill="url(#fade-${c.id})"/><path d="${path}" fill="none" stroke="#3987e5" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(c.price)}" r="4" fill="#76b1ff"/><text x="${W-R+7}" y="${y(c.price)+31}" fill="#e9eef6" font-size="14" font-weight="650">${num(c.price,2)}</text><text x="${W-R+7}" y="${(y(c.low)+y(c.high))/2}" fill="#fab219" font-size="13" font-weight="650">+${num((c.price/c.low-1)*100,0)}%</text><text x="${W-R+7}" y="${(y(c.low)+y(c.high))/2+16}" fill="#8494ac" font-size="10">저가 대비</text>`;
if(c.id==='SPI'){const event='2026-05-15',k=s.findIndex(p=>p.d>=event);if(k>=0){g+=`<line x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${H-B}" stroke="#796125" stroke-dasharray="3 5"/><text x="${Math.max(L+3,x(k)-60)}" y="17" fill="#c9a349" font-size="11">5/14 · 250p 인수제안</text>`}}
box.innerHTML=`<div class="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.name} 실제 ${years}년 주간 종가 차트, 마지막 ${c.price} ${c.unit}, 52주 고가 ${c.high}, 저가 ${c.low}"><defs><linearGradient id="fade-${c.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3987e5" stop-opacity=".12"/><stop offset="100%" stop-color="#3987e5" stop-opacity="0"/></linearGradient></defs>${g}<line class="cross" visibility="hidden" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#8494ac" stroke-dasharray="3 3"/><circle class="dot" visibility="hidden" r="4" fill="#e9eef6"/><rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
const hit=box.querySelector('.hit'),cross=box.querySelector('.cross'),dot=box.querySelector('.dot'),tip=box.querySelector('.tip');hit.addEventListener('pointermove',e=>{const r=box.querySelector('svg').getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(s[i].c));dot.setAttribute('visibility','visible');tip.textContent=s[i].d+' 주 종가 · '+num(s[i].c,2)+' '+c.unit;tip.style.display='block'});hit.addEventListener('pointerleave',()=>{tip.style.display='none';cross.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden')})}

function saveFile(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#downloadJSON').onclick=()=>saveFile(JSON.stringify(D,null,2),'europe_list23_20261120.json','application/json');$('#downloadCSV').onclick=()=>{const rows=[['기준일','국가','기업','종목','원본시총_조원','원본신고가일','종가','주가통화','고가대비_pct','참고기업','최신실적','가이던스','출처'],...D.companies.map(c=>[D.asof,c.country,c.name,c.symbol,c.cap,c.date,c.price,c.unit,c.gap.toFixed(3),c.reference?'참고':'',c.earnings,c.guidance,c.officialURL])];saveFile('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'europe_list23_20261120.csv','text/csv;charset=utf-8')};
const deck=$('#deck'),sections=[...document.querySelectorAll('section')];let active=0,queued=false;function position(){active=0;const t=deck.getBoundingClientRect().top;sections.forEach((s,i)=>{if(s.getBoundingClientRect().top-t<=150)active=i});$('#position').textContent=(active+1)+' / '+sections.length;$('#prev').disabled=active===0;$('#next').disabled=active===sections.length-1;queued=false}function go(i){i=Math.max(0,Math.min(sections.length-1,i));sections[i].scrollIntoView({behavior:'instant'});history.replaceState(null,'','#'+sections[i].id)}deck.addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(position)}});$('#prev').onclick=()=>go(active-1);$('#next').onclick=()=>go(active+1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,summary')||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End'].includes(e.key)){e.preventDefault();go(e.key==='Home'?0:e.key==='End'?sections.length-1:active+(['ArrowDown','PageDown'].includes(e.key)?1:-1))}});if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView({behavior:'instant'})}position();
