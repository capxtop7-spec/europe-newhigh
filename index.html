function chartSvg(c,mini=false){const data=c.prices, W=900,H=166,top=15,bottom=139,left=43,right=847,miniHeight=H;const min=Math.min(...data),max=Math.max(...data),range=(max-min)||1,lo=min-range*.12,hi=max+range*.16;const x=i=>left+(right-left)*i/(data.length-1),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);const coords=data.map((v,i)=>[x(i),y(v)]);const line=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const area=line+` L${right} ${bottom} L${left} ${bottom} Z`;let ys='';for(let i=0;i<4;i++){let v=lo+(hi-lo)*i/3,yy=y(v);ys+=`<line class="axis" x1="${left}" x2="${right}" y1="${yy}" y2="${yy}"/><text class="ylabel" x="2" y="${yy+4}">${fmt(v)}</text>`};const wk=dates.indexOf(c.date.slice(-5));const h=wk>=0?`<line class="highline" x1="${x(wk)}" x2="${x(wk)}" y1="${top}" y2="${bottom}"/>`:'';const last=coords.at(-1);return `<svg class="graph" viewBox="0 0 900 166" preserveAspectRatio="none" data-code="${c.code}" aria-label="${safe(c.name)} 일별 종가 차트 11월 3일부터 20일"><defs><linearGradient id="grad-${c.code}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#60d9ba" stop-opacity=".22"/><stop offset="100%" stop-color="#60d9ba" stop-opacity="0"/></linearGradient></defs>${ys}<rect x="${x(9)}" y="${top}" width="${right-x(9)}" height="${bottom-top}" fill="#6a9fbb" opacity=".065"/>${h}<path d="${area}" fill="url(#grad-${c.code})"/><path d="${line}" class="line"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" class="dot"/><text class="xlabels" x="${left}" y="157">11/03</text><text class="xlabels" x="${x(9)}" y="157">11/16</text><text class="xlabels" x="${right-30}" y="157">11/20</text><rect class="hit-area" x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="transparent"/></svg>`}
function chart(c){const ch=pct(c.prices.at(-1),c.prices[0]);return `<div class="chart short-window"><div class="chartheader"><div><b>단기 흐름</b> <span class="subtitle">11/03–11/20 · 종가 · ${c.currency}</span></div><div><span class="price">${fmt(c.prices.at(-1))}</span> <span class="change ${ch>=0?'green':'red'}">${sign(ch)} / 11월 3일 대비</span></div></div><div class="chartwrap">${chartSvg(c)}<div class="tip"></div></div><div class="chartnote"><span>음영 = 신고가 관찰 주간 · 점선 = 신고가 신고일(날짜 특정 시)</span><span><a target="_blank" rel="noopener" href="${c.chart_link}">전체 기간 차트 ↗</a></span></div></div>`}
function cover(){return `<section id="cover"><div class="container"><div class="eyebrow">WEEKLY / EQUITY RESEARCH / 2026.11.20 CLOSE</div><h1>유럽 52주 신고가<br><span class="green">21개</span> 기업 확장판</h1><div class="intro">영국 · 프랑스 · 독일 / 2026.11.16—11.20<br>기존 17개 + 추가 확인한 4개 · 기업별 52주 주가 차트 · 신고가 원인과 사업모델</div><div class="tilegrid"><div class="tile"><small>총 기업 수</small><strong>21</strong><small>원본 17 + 신규 4</small></div><div class="tile"><small>영국</small><strong>${countries.영국}</strong><small>소비재·금융·수도</small></div><div class="tile"><small>프랑스</small><strong>${countries.프랑스}</strong><small>바이오·소재 등</small></div><div class="tile"><small>독일</small><strong>${countries.독일}</strong><small>보험·특수화학 등</small></div></div><div class="row2"><div class="box"><h3>새로 추가한 기업</h3><div class="summary">🇩🇪 <b>에보닉</b> · 특수화학 / M&A 급반전<br>🇬🇧 <b>코카콜라 유로퍼시픽 파트너스</b> · 음료<br>🇬🇧 <b>넥스트</b> · 의류·온라인 유통<br>🇬🇧 <b>유나이티드 유틸리티스</b> · 수도 인프라</div></div><div class="box"><h3>차트에서 볼 핵심</h3><div class="summary">① <b>11/16~20</b> 신고가 구간 표시<br>② 종목별 1년 주가 차트(인터넷 연결 시)<br>③ 신고가 이후 <b>이벤트 반전</b> 여부 비교<br>④ 기업별 신고가 원인과 국내 비교기업</div></div></div><p class="note" style="margin-top:14px">※ 기본 차트는 인터넷 연결 시 최근 12개월. 기존 17개는 사용자 제공 목록 기반. 추가 4개는 시장 자료에서 해당 주 52주 신고가 확인. 이 페이지는 11/20 종가 기준 고정 스냅샷이야.</p></div></section>`}
function sectorPage(){return `<section id="sector-map"><div class="container"><div class="eyebrow">SECTOR / BREADTH</div><h2>어떤 산업군이 형성되고 있을까?</h2><p class="intro" style="font-size:14px;margin-top:7px">이번에 정리한 21개 기업 표본을 기준으로 분류한 것이며, 전체 유럽 시장 업종 지수는 아니야.</p><div class="sectors">${sectors.map(s=>{let n=sectCounts[s]||0;let txt={'바이오·헬스케어':'장비·소모품 / 콘바텍 실적·스파이어 M&A는 개별','금융·보험':'영국·프랑스·독일의 보험사 3개 동반 강세','산업가스·특수화학':'산업가스·접착제·기능성 원료 / 에보닉은 인수 무산 급락','유통·소비재':'영국 주류·음료·의류·할인점의 개별 실적과 방어 소비','수도·공공인프라':'규제 수도사업의 안정적 수익 / 추가 종목은 1개','기타':'호텔·인력·학술정보: 개별 이슈 중심'}[s];return `<div class="s-card"><div class="count">${n} COMPANIES</div><h3>${s}</h3><p>${txt}</p><button class="link" data-sector="${s}">해당 기업으로 이동</button></div>`}).join('')}</div><div class="box" style="margin-top:16px"><h3>해석</h3><div class="summary">독립적인 대형 보험회사 3개가 여러 국가에서 동반 신고가를 만들었다는 점은 의미가 커. 하지만 특수화학과 소비재는 <b>실적·M&A·거래 이벤트가 섞여 있으므로</b> 섹터 전체 강세로 과장하면 안 돼. <b>에보닉의 11/19 급락</b>은 신고가가 나왔다고 추세가 유지되는 게 아님을 보여줘.</div></div></div></section>`}
function listPage(){return `<section id="list"><div class="container"><div class="eyebrow">MASTER LIST / 21 COMPANIES</div><h2>종목 선택</h2><div class="filterbar"><input id="query" placeholder="기업명·영문·국내 비교기업 검색"/><select id="sectorF"><option value="">모든 섹터</option>${sectors.map(s=>`<option>${s}</option>`).join('')}</select><select id="countryF"><option value="">모든 국가</option><option>영국</option><option>프랑스</option><option>독일</option></select><label style="font-size:12px;color:#bed1e4;align-self:center"><input id="onlyAdded" type="checkbox"/> 신규 4개만</label></div><div class="tablewrap"><table><thead><tr><th>#</th><th>기업</th><th>국가</th><th>섹터</th><th>원인</th><th class="num">시총 (조원)</th><th class="num">11/03→11/20</th></tr></thead><tbody id="tbody">${companies.map((c,i)=>{let p=pct(c.prices.at(-1),c.prices[0]);return `<tr class="${c.added?'addedrow':''}" data-code="${c.code}" data-s="${c.sector}" data-c="${c.country}" data-search="${safe((c.name+c.en+c.code+c.kr).toLowerCase())}" data-added="${c.added}"><td>${i+1}</td><td><strong>${c.name} ${c.added?'<span class="pill added">NEW</span>':''}</strong><small>${c.en}</small></td><td>${c.flag} ${c.country}</td><td>${c.sector}</td><td>${c.type}</td><td class="num">${c.cap.toFixed(1)}</td><td class="num ${p>=0?'green':'red'}">${sign(p)}</td></tr>`}).join('')}</tbody></table></div><p class="note" id="listnote" style="margin-top:12px">행을 누르면 해당 기업의 분석과 차트로 이동해.</p></div></section>`}

function longChart(c){return `<div class="long-chart"><div class="long-chart-top"><strong>52주 주가 흐름 <span class="pill sector">1년 · 일봉</span></strong><span>TradingView 제공 · 인터넷 필요</span></div><div class="tv-host" id="tv-${c.code}" data-ticker="${safe(c.ticker)}"><div class="tv-fallback"><div style="font-size:14px;font-weight:700">1년 주가 차트를 불러오고 있어</div><div style="font-size:12px">네트워크 연결이 필요해. 차트가 나오지 않으면 아래 링크를 이용해줘.</div><a target="_blank" rel="noopener" href="${c.chart_link}">TradingView에서 1년 차트 열기 ↗</a></div></div><div class="long-chart-tools"><span class="note">열람 시점 기준 최근 12개월이야. 신고가 분석 대상은 2026.11.16~20이며, 차트 날짜가 고정된 과거 스냅샷은 아니야.</span><a target="_blank" rel="noopener" href="${c.chart_link}">전체 화면 ↗</a></div></div>`}

function companyPage(c,i){let ch=pct(c.prices.at(-1),c.prices[0]);return `<section id="co-${c.code}"><div class="container narrow"><div class="company"><div class="head"><div><div class="eyebrow">COMPANY ${String(i+1).padStart(2,'0')} / ${companies.length} ${c.added?'· NEW ADDITION':''}</div><h2><button class="fav" data-fav="${c.code}" title="북마크">☆</button> ${c.name} <span style="font-size:15px;color:#99b5cd;font-weight:500">${c.code}</span></h2><div class="en">${c.en}</div><div class="chips"><span class="pill">${c.flag} ${c.country}</span><span class="pill sector">${c.sector}</span><span class="pill ${c.type.includes('M&A')?'event':''}">${c.type}</span>${c.added?'<span class="pill added">추가 확인</span>':''}<span class="pill">신고가 ${c.date}</span></div></div><div class="cap"><small>시총 · 원화 환산</small><b>${c.cap.toFixed(1)}조 원</b><small>11/20 종가 · ${fmt(c.prices.at(-1))} ${c.currency}</small></div></div><div class="headline"><b>핵심 사업</b> · ${safe(c.line)}</div>${longChart(c)}<details class="short-window"><summary class="pill" style="cursor:pointer;margin:9px 0">11월 3~20일 단기 차트 펼치기</summary>${chart(c)}</details><div class="why"><b>왜 신고가인가?</b> ${safe(c.why)}</div><div class="lowgrid"><article><div class="label">01 · 비즈니스 모델</div><p>${safe(c.biz)}</p></article><article><div class="label">02 · 국내 비교기업</div><p>${safe(c.kr)}</p></article><article><div class="label">03 · 추적할 지표</div><p>${safe(c.check)}</p></article><article><div class="label">04 · 해석 유의점</div><p>${safe(c.caveat)}</p></article></div><div class="footrow"><span class="note">단기 종가 출처: ${c.code==='SPG'||c.added?'Stock Analysis':'Alpha Vantage'} · 2026.11.20 고정</span><div><a href="${c.price_link}" target="_blank" rel="noopener">주가 원자료 ↗</a> &nbsp; <a href="${c.chart_link}" target="_blank" rel="noopener">1년 차트 ↗</a> &nbsp; <button class="link" data-copy="${c.code}">종목 링크 복사</button></div></div></div></div></section>`}
const deck=$('#deck');deck.innerHTML=cover()+sectorPage()+listPage()+companies.map(companyPage).join('');
const pages=[...deck.querySelectorAll('section')],page=$('#page'),progress=$('#progress');
function cur(){const y=deck.scrollTop+deck.clientHeight*.35;let i=0;for(const [j,el] of pages.entries())if(el.offsetTop<=y)i=j;return i}
function nav(i){let el=pages[Math.max(0,Math.min(pages.length-1,i))];el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+el.id)}
function goto(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id)}}
function update(){let n=cur();page.textContent=(n+1)+' / '+pages.length;progress.style.width=((n+1)/pages.length*100)+'%'}let raf;deck.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{update();raf=null})},{passive:true});update();$('#prev').onclick=()=>nav(cur()-1);$('#next').onclick=()=>nav(cur()+1);$('#maplink').onclick=()=>goto('sector-map');$('#listlink').onclick=()=>goto('list');
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();nav(cur()+1)}else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();nav(cur()-1)}});
function filter(){const q=$('#query').value.toLowerCase(),s=$('#sectorF').value,c=$('#countryF').value,a=$('#onlyAdded').checked;let n=0;document.querySelectorAll('#tbody tr').forEach(t=>{let ok=(!q||t.dataset.search.includes(q))&&(!s||s===t.dataset.s)&&(!c||c===t.dataset.c)&&(!a||t.dataset.added==='true');t.style.display=ok?'':'none';if(ok)n++});$('#listnote').textContent=n+'개 표시 · 행 클릭 시 해당 기업으로 이동'}['query','sectorF','countryF','onlyAdded'].forEach(k=>$('#'+k).addEventListener(k==='query'?'input':'change',filter));
const favorites=new Set();try{JSON.parse(localStorage.getItem('eunewhigh_favs')||'[]').forEach(x=>favorites.add(x))}catch(e){}document.querySelectorAll('[data-fav]').forEach(b=>b.textContent=favorites.has(b.dataset.fav)?'★':'☆');
deck.addEventListener('click',e=>{const r=e.target.closest('tr[data-code]');if(r)return goto('co-'+r.dataset.code);const b=e.target.closest('[data-sector]');if(b){let c=companies.find(x=>x.sector===b.dataset.sector);if(c)goto('co-'+c.code);return}const f=e.target.closest('[data-fav]');if(f){favorites.has(f.dataset.fav)?favorites.delete(f.dataset.fav):favorites.add(f.dataset.fav);f.textContent=favorites.has(f.dataset.fav)?'★':'☆';try{localStorage.setItem('eunewhigh_favs',JSON.stringify([...favorites]))}catch(e){}return}const copy=e.target.closest('[data-copy]');if(copy){const link=location.href.split('#')[0]+'#co-'+copy.dataset.copy;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(link).then(()=>copy.textContent='복사 완료 ✓').catch(()=>window.prompt('링크 복사',link))}else window.prompt('링크 복사',link);return}});
document.querySelectorAll('.graph').forEach(svg=>{const c=companies.find(x=>x.code===svg.dataset.code);const tip=svg.parentElement.querySelector('.tip');svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),position=(e.clientX-r.left)/r.width,idx=Math.max(0,Math.min(13,Math.round((position-43/900)/(804/900)*13)));tip.style.display='block';tip.style.left=Math.max(0,Math.min(r.width-120,e.clientX-r.left+8))+'px';tip.style.top='4px';tip.textContent=dates[idx]+' · '+fmt(c.prices[idx])+' '+c.currency});svg.addEventListener('pointerleave',()=>tip.style.display='none')});
if(location.hash){const id=decodeURIComponent(location.hash.slice(1));if(document.getElementById(id)){setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'instant',block:'start'}),100)}}

// Lazy-load the one-year TradingView chart only when a company card gets near the viewport.
const tvObserver=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{if(!entry.isIntersecting)return;
  const host=entry.target;if(host.dataset.loaded==='true')return;
  host.dataset.loaded='true';tvObserver.unobserve(host);
  const container=document.createElement('div');container.className='tradingview-widget-container';container.style.cssText='width:100%;height:100%';
  const inner=document.createElement('div');inner.className='tradingview-widget-container__widget';inner.style.cssText='width:100%;height:100%';container.appendChild(inner);
  const link=document.createElement('a');link.href='https://www.tradingview.com/';link.target='_blank';link.rel='noopener';link.style.cssText='font-size:9px;color:#87a8c8';link.textContent='TradingView';container.appendChild(link);
  const s=document.createElement('script');s.type='text/javascript';s.async=true;s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  s.textContent=JSON.stringify({autosize:true,symbol:host.dataset.ticker,interval:'D',timezone:'Europe/London',theme:'dark',style:'1',locale:'kr',allow_symbol_change:false,save_image:false,calendar:false,backgroundColor:'rgba(8,24,40,1)',gridColor:'rgba(42,66,89,.3)',range:'12M',hide_top_toolbar:false,hide_legend:false,withdateranges:true,studies:[]});
  container.appendChild(s);host.innerHTML='';host.appendChild(container);
  s.onerror=()=>{host.innerHTML='<div class="tv-fallback">차트 데이터를 불러오지 못했어. 상단 종목의 전체 화면 링크를 사용해줘.</div>'};
  });
},{root:document.getElementById('deck'),rootMargin:'450px 0px',threshold:0});
document.querySelectorAll('.tv-host').forEach(el=>tvObserver.observe(el));

</script></body></html>
